# ModerServer Hardened Kernel Parameters for Alpine Linux
# Tuned for Kubernetes (K3s) and hardened against local privilege escalation and network attacks

# 1. Packet Forwarding for Flannel CNI & WireGuard
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# 2. Kernel Self-Protection & Exploit Mitigation
# Prevent unprivileged users/containers from reading kernel dmesg logs (blocks memory layout leakage)
kernel.dmesg_restrict = 1

# Hide exposed kernel symbol addresses from /proc/kallsyms
kernel.kptr_restrict = 2

# Disable unprivileged eBPF loading to prevent kernel bytecode exploits
kernel.unprivileged_bpf_disabled = 1

# Restrict ptrace process memory inspection (blocks non-parent debugger attachments)
kernel.yama.ptrace_scope = 2

# 3. Network Hardening & Anti-Spoofing
# SYN flood protection
net.ipv4.tcp_syncookies = 1

# Reverse-path filtering (loose mode = 2 required for Kubernetes CNI / Flannel VXLAN packet routing)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Drop source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Ignore ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Ignore ICMP broadcast pings and bogus errors
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# 4. Filesystem Protection (Hardlink/Symlink TOCTOU attack prevention)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# File system inotify limits for Nextcloud, Mealie, and media file watchers
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# Memory map count required by embedded search, Vector DBs, and SQLite WAL mode
vm.max_map_count = 262144

# Keep RAM free for K3s workloads; swap only under memory pressure
vm.swappiness = 10

# Socket buffer limits
net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384
