# ModerServer Unattended Alpine Linux Installation Profile
# Usage: setup-alpine -f answers.conf

KEYMAPOPTS="us us"
HOSTNAMEOPTS="-n moderserver"
INTERFACESOPTS="-a"
DNSOPTS="-d local.moderserver.org 9.9.9.9 149.112.112.112"
TIMEZONEOPTS="-z UTC"
PROXYOPTS="none"
APKREPOSOPTS="-1 -c"
SSHDOPTS="none"
NTPOPTS="-c chrony"

# Automatically select the first available physical or virtual installation disk (NVMe, SATA, VirtIO)
TARGET_DISK=$(lsblk -d -n -o NAME,TYPE 2>/dev/null | awk '$2=="disk" && $1!~/(loop|sr|ram|fd)/ {print "/dev/"$1; exit}')
DISKOPTS="-m sys ${TARGET_DISK:-/dev/sda}"

USEROPTS="none"
