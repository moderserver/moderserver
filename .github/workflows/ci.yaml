name: ModerServer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default; the jobs that publish request more explicitly.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (Static Checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: "v4.3.1"

      - name: Run Static Verifications
        run: |
          make verify-all

  detect-components:
    name: Detect Components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.list.outputs.components }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: List Platform Components
        id: list
        run: |
          COMPONENTS=$(find platform/components -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"
          echo "Found components: $COMPONENTS"

  conformance-static:
    name: Conformance Static (${{ matrix.component }})
    needs: detect-components
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect-components.outputs.components) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: "v4.3.1"

      - name: Run Static Conformance
        run: |
          make test-conformance COMPONENT=${{ matrix.component }}

  build-components:
    name: Build (Platform Components)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Images are only built and archived here. They are published by the
      # promote job, once the exact same archives passed every test.
      - name: Build Platform Component Images
        run: |
          ./hack/build-components.sh --save-dir _output/images

      - name: Upload Platform Images Artifact
        uses: actions/upload-artifact@v7
        with:
          name: moderserver-platform-images
          path: _output/images/*.tar
          retention-days: 1
          if-no-files-found: error

  build-conformance:
    name: Build (Conformance Image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Conformance Container Image
        run: |
          PUSH_FLAG=""
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            PUSH_FLAG="--push"
          fi
          ./hack/build-conformance.sh ${PUSH_FLAG}

  build:
    name: Build (OS Image)
    needs: build-components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: "v4.3.1"

      - name: Download Platform Images
        uses: actions/download-artifact@v8
        with:
          name: moderserver-platform-images
          path: _output/images

      - name: Build Bootable Installer Image
        run: |
          make build-image

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: moderserver-installer-iso
          path: _output/*.iso
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E (QEMU VM Test)
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: "v4.3.1"

      - name: Install QEMU & Virtualization Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage p7zip-full
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Download Installer Artifact
        uses: actions/download-artifact@v8
        with:
          name: moderserver-installer-iso
          path: _output

      - name: Run QEMU E2E Test
        run: |
          make test-e2e

  conformance-runtime:
    name: Conformance (Runtime Analysis)
    needs: [conformance-static, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: "v4.3.1"

      - name: Install QEMU & Virtualization Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage p7zip-full
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Download Installer Artifact
        uses: actions/download-artifact@v8
        with:
          name: moderserver-installer-iso
          path: _output

      - name: Run Runtime Conformance Analysis
        run: |
          make test-conformance-runtime

  # Releases a verified commit: publishes the tested images, then moves the
  # `stable` branch that every ModerServer node follows. Nothing reaches a node
  # unless static verification, static conformance, the QEMU E2E suite and
  # runtime conformance all passed on this exact commit.
  promote:
    name: Promote (Publish Images & Advance stable)
    needs: [verify, conformance-static, e2e, conformance-runtime]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: promote-stable
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Platform Images
        uses: actions/download-artifact@v8
        with:
          name: moderserver-platform-images
          path: _output/images

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Tested Platform Images
        run: |
          ./hack/push-components.sh _output/images

      - name: Advance stable Branch
        run: |
          git fetch origin '+refs/heads/stable:refs/remotes/origin/stable' || true
          if git rev-parse --verify --quiet origin/stable >/dev/null && ! git merge-base --is-ancestor origin/stable "${GITHUB_SHA}"; then
            echo "::notice::stable is not an ancestor of ${GITHUB_SHA} (a newer commit was already promoted); leaving it untouched."
            exit 0
          fi
          git push origin "${GITHUB_SHA}:refs/heads/stable"
