# ModerServer node configuration
# Installed at /etc/moderserver/moderserver.conf
#
# Read at every boot by the moderserver-bootstrap service, which (re)applies
# the root GitOps Application from these values. Everything else on the node
# is reconciled from the Git repository below.

# Git repository holding the declarative configuration of this server.
# Point it at your own fork to own your configuration.
GITOPS_REPO_URL="https://github.com/moderserver/moderserver.git"

# Branch, tag or commit to follow. `stable` only ever points at commits that
# passed the full verification pipeline.
GITOPS_REVISION="stable"

# Base domain of the server: applications are served at <app>.<domain>
DOMAIN="home.arpa"
