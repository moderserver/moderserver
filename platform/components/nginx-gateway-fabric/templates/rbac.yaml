apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-gateway
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
rules:
  # Data plane resources provisioned for the Gateway of this namespace
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - serviceaccounts
      - services
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
  - apiGroups:
      - ""
    resources:
      - services/status
    verbs:
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx-gateway
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nginx-gateway
subjects:
  - kind: ServiceAccount
    name: nginx-gateway
    namespace: nginx-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
rules:
  # NGINX data plane agents authenticate to the control plane with their
  # ServiceAccount token, which the control plane validates
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - configmaps
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gatewayclasses/status
      - gateways
      - gateways/status
      - gateways/finalizers
      - httproutes
      - httproutes/status
      - grpcroutes
      - grpcroutes/status
      - tlsroutes
      - tlsroutes/status
      - tcproutes
      - tcproutes/status
      - udproutes
      - udproutes/status
      - referencegrants
      - backendtlspolicies
      - backendtlspolicies/status
      - listenersets
      - listenersets/status
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - gateway.nginx.org
    resources:
      - nginxgateways
      - nginxgateways/status
      - nginxproxies
      - nginxproxies/status
      - snippetsfilters
      - authenticationfilters
      - externalloadbalancers
      - accesspolicies
      - clientsettingspolicies
      - observabilitypolicies
      - payloadprocessors
      - proxysettingspolicies
      - ratelimitpolicies
      - snippetspolicies
      - upstreamsettingspolicies
      - wafpolicies
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nginx-gateway
subjects:
  - kind: ServiceAccount
    name: nginx-gateway
    namespace: nginx-gateway
