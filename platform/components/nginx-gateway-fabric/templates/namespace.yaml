apiVersion: v1
kind: Namespace
metadata:
  name: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    # The data plane binds host ports 80/443, which the baseline and restricted
    # Pod Security profiles forbid, so enforcement stays at privileged for this
    # namespace only. Violations of restricted are still audited and warned.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
