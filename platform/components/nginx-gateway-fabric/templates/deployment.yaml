apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: nginx-gateway
      securityContext:
        {{- include "common.security.pod" (dict "uid" 101 "gid" 1001) | nindent 8 }}
      containers:
        - name: nginx-gateway
          image: {{ include "common.images.ref" (dict "ctx" . "name" "nginx-gateway-fabric") | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - controller
            - --gateway-ctlr-name=gateway.nginx.org/nginx-gateway-controller
            - --gatewayclass=nginx
            - --service=nginx-gateway
            - --agent-tls-secret=agent-tls
            - --health-port=9099
            - --metrics-disable
            - --leader-election-disable
            - --product-telemetry-disable
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/instance']
            - name: IMAGE_NAME
              value: {{ include "common.images.ref" (dict "ctx" . "name" "nginx-gateway-fabric") | quote }}
          ports:
            - name: agent-grpc
              containerPort: 8443
            - name: health
              containerPort: 9099
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            {{- include "common.security.container" (dict "uid" 101 "gid" 1001) | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-agent-tls
              mountPath: /var/run/secrets/ngf
              readOnly: true
      {{- include "common.scheduling.controlPlane" . | nindent 6 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-agent-tls
          secret:
            secretName: agent-tls
