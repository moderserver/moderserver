apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: nginx-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      containers:
        - name: nginx-gateway
          image: "ghcr.io/moderserver/nginx-gateway-fabric:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          args:
            - controller
            - --gateway-ctlr-name=gateway.nginx.org/nginx-gateway-controller
            - --gatewayclass=nginx
            - --service=nginx-gateway
            - --agent-tls-secret=agent-tls
            - --health-port=9099
            - --metrics-disable
            - --leader-election-disable
            - --product-telemetry-disable
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/instance']
            - name: IMAGE_NAME
              value: "ghcr.io/moderserver/nginx-gateway-fabric:{{ .Chart.AppVersion }}"
          ports:
            - name: health
              containerPort: 9099
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            {{- include "common.security.container" . | nindent 12 }}
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-agent-tls
              mountPath: /var/run/secrets/ngf
              readOnly: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-agent-tls
          secret:
            secretName: agent-tls
