apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: health
      port: 9099
      targetPort: health
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4 }}
