apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    # NGINX data plane agents connect back to the control plane on this port
    - name: agent-grpc
      port: 443
      targetPort: agent-grpc
    - name: health
      port: 9099
      targetPort: health
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4 }}
