{{ include "common.networkpolicy.defaultDeny" (dict "ctx" . "namespace" "nginx-gateway") }}
---
# Gateway listeners: reachable from anywhere (home network clients and pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-listeners
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: moderserver-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
# Control plane: only the NGINX data plane agents of this namespace connect to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-gateway-control-plane
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
