apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: moderserver-gateway
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: moderserver-gateway-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: moderserver-gateway-tls
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  commonName: {{ printf "gateway.%s" (include "nginx-gateway-fabric.domain" .) | quote }}
  secretName: moderserver-gateway-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: moderserver-ca
    kind: ClusterIssuer
  dnsNames:
    {{- $domain := include "nginx-gateway-fabric.domain" . }}
    {{- range (list (printf "*.%s" $domain) $domain "localhost" | uniq) }}
    - {{ . | quote }}
    {{- end }}
---
# Plain HTTP is never served: every request on the HTTP listener is redirected
# to HTTPS. Application routes attach to the https listener only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  parentRefs:
    - name: moderserver-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
