{{- $ca := genCA "nginx-gateway-ca" 3650 -}}
{{- $cert := genSignedCert "nginx-gateway" nil (list "nginx-gateway" "nginx-gateway.nginx-gateway" "nginx-gateway.nginx-gateway.svc" "nginx-gateway.nginx-gateway.svc.cluster.local") 3650 $ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: nginx-gateway-server-tls
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-tls
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
