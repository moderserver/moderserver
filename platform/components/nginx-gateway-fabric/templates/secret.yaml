apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-gateway-agent-tls
  namespace: nginx-gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  commonName: nginx-gateway
  secretName: agent-tls
  duration: 87600h
  renewBefore: 720h
  issuerRef:
    name: moderserver-ca
    kind: ClusterIssuer
  dnsNames:
    - nginx-gateway
    - nginx-gateway.nginx-gateway
    - nginx-gateway.nginx-gateway.svc
    - nginx-gateway.nginx-gateway.svc.cluster.local
