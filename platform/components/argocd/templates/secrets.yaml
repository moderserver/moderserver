apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
data:
  server.secretkey: {{ "moderserver-argocd-secretkey" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-redis
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
data:
  auth: {{ "moderserver-redis-token" | b64enc | quote }}
