# argocd-secret is intentionally shipped empty: argocd-server generates
# server.secretkey and the initial admin password on first start, so every
# install gets its own values. The platform Application ignores differences on
# this Secret's data so the generated keys are never reverted.
#
# The Redis password lives in the argocd-redis Secret, generated on first start
# by the secret-init container of the argocd-redis Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
