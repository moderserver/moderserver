apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-application-controller
  namespace: argocd
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: application-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: application-controller
        app.kubernetes.io/part-of: moderserver
    spec:
      serviceAccountName: argocd-application-controller
      securityContext:
        {{- include "common.security.pod" (dict) | nindent 8 }}
      containers:
        - name: argocd-application-controller
          image: {{ include "common.images.ref" (dict "ctx" . "name" "argocd") | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/argocd-application-controller
          args:
            - --status-processors=10
            - --operation-processors=5
            - --redis=argocd-redis:6379
            - --repo-server=argocd-repo-server:8081
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argocd-redis
                  key: auth
          ports:
            - name: metrics
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            {{- include "common.security.container" (dict) | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/argocd
            - name: tls-certs
              mountPath: /app/config/tls
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: tls-certs
          configMap:
            name: argocd-tls-certs-cm
      {{- include "common.scheduling.controlPlane" . | nindent 6 }}
