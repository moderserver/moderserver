apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}-server
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: moderserver
    spec:
      serviceAccountName: argocd-server
      securityContext:
        {{- include "common.security.pod" (dict) | nindent 8 }}
      containers:
        - name: argocd-server
          image: {{ include "common.images.ref" (dict "ctx" . "name" "argocd") | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/argocd-server
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argocd-redis
                  key: auth
            - name: REDIS_SERVER
              value: "argocd-redis:6379"
            - name: ARGOCD_SERVER_INSECURE
              value: "true"
            - name: ARGOCD_SERVER_REPO_SERVER
              value: "argocd-repo-server:8081"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz?full=true
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            {{- include "common.security.container" (dict) | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/argocd
            - name: ssh-known-hosts
              mountPath: /app/config/ssh
            - name: tls-certs
              mountPath: /app/config/tls
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: ssh-known-hosts
          configMap:
            name: argocd-ssh-known-hosts-cm
        - name: tls-certs
          configMap:
            name: argocd-tls-certs-cm
      {{- include "common.scheduling.controlPlane" . | nindent 6 }}
