apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
  namespace: argocd
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: moderserver
    spec:
      serviceAccountName: argocd-redis
      securityContext:
        {{- include "common.security.pod" (dict) | nindent 8 }}
      initContainers:
        # Generates the argocd-redis Secret with a random password on first start.
        # The Secret is never stored in Git, so every install has its own credential.
        - name: secret-init
          image: {{ include "common.images.ref" (dict "ctx" . "name" "argocd") | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/argocd
            - admin
            - redis-initial-password
          securityContext:
            {{- include "common.security.container" (dict) | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: redis
          image: {{ include "common.images.ref" (dict "ctx" . "name" "argocd-redis") | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argocd-redis
                  key: auth
          ports:
            - name: tcp-redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            {{- include "common.security.container" (dict) | nindent 12 }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
      {{- include "common.scheduling.controlPlane" . | nindent 6 }}
