apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  parentRefs:
    - name: moderserver-gateway
      namespace: nginx-gateway
  hostnames:
    - "argocd.home.arpa"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
