apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: applicationset-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}-applicationset
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}-applicationset
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: applicationset-controller
        app.kubernetes.io/part-of: moderserver
    spec:
      serviceAccountName: argocd-applicationset-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      containers:
        - name: argocd-applicationset-controller
          image: "ghcr.io/moderserver/argocd-applicationset:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-addr=:8080
          ports:
            - name: webhook
              containerPort: 7000
            - name: metrics
              containerPort: 8080
          securityContext:
            {{- include "common.security.container" . | nindent 12 }}
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/argocd
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
