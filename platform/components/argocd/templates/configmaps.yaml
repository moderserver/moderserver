apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  url: "https://argocd.home.arpa"
  resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "CRD is healthy"
    return hs
  resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
    jqPathExpressions:
      - .spec.conversion
      - .status
  resource.customizations.health.cert-manager.io_ClusterIssuer: |
    hs = {}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" and condition.status == "True" then
          hs.status = "Healthy"
          hs.message = "ClusterIssuer is ready"
          return hs
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for ClusterIssuer to be ready"
    return hs
  resource.customizations.health.cert-manager.io_Issuer: |
    hs = {}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" and condition.status == "True" then
          hs.status = "Healthy"
          hs.message = "Issuer is ready"
          return hs
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for Issuer to be ready"
    return hs
  resource.customizations.health.cert-manager.io_Certificate: |
    hs = {}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" and condition.status == "True" then
          hs.status = "Healthy"
          hs.message = condition.message or "Certificate is ready"
          return hs
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for certificate to be issued"
    return hs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  server.insecure: "true"
  server.basehref: "/"
  repo.server: "argocd-repo-server:8081"
  redis.server: "argocd-redis:6379"
  controller.diff.server.side: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  policy.default: "role:admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-ssh-known-hosts-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: repo-server
data:
  ssh_known_hosts: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-tls-certs-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: repo-server
data: {}
