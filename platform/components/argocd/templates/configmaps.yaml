apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  url: "https://argocd.home.arpa"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  server.insecure: "true"
  server.basehref: "/"
  repo.server: "argocd-repo-server:8081"
  redis.server: "argocd-redis:6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  policy.default: "role:admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-ssh-known-hosts-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: repo-server
data:
  ssh_known_hosts: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-tls-certs-cm
  namespace: argocd
  labels:
    {{- include "argocd.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: repo-server
data: {}
