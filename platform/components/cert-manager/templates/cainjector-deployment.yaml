apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: cainjector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}-cainjector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}-cainjector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cainjector
        app.kubernetes.io/part-of: moderserver
    spec:
      serviceAccountName: cert-manager-cainjector
      securityContext:
        {{- include "common.security.pod" (dict) | nindent 8 }}
      containers:
        - name: cert-manager-cainjector
          image: {{ include "common.images.ref" (dict "ctx" . "name" "cert-manager-cainjector") | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --leader-election-namespace=cert-manager
          securityContext:
            {{- include "common.security.container" (dict) | nindent 12 }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      {{- include "common.scheduling.controlPlane" . | nindent 6 }}
