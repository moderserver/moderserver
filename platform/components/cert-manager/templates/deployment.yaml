apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: cert-manager
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: cert-manager
      securityContext:
        {{- include "common.security.pod" (dict) | nindent 8 }}
      containers:
        - name: cert-manager-controller
          image: {{ include "common.images.ref" (dict "ctx" . "name" "cert-manager-controller") | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --cluster-resource-namespace=cert-manager
            - --leader-election-namespace=cert-manager
            - --enable-gateway-api
          ports:
            - name: http-healthz
              containerPort: 9403
          livenessProbe:
            httpGet:
              path: /livez
              port: http-healthz
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 8
          securityContext:
            {{- include "common.security.container" (dict) | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      {{- include "common.scheduling.controlPlane" . | nindent 6 }}
