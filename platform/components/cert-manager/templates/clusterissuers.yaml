apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: moderserver-selfsigned
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: moderserver-ca
  namespace: cert-manager
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  isCA: true
  commonName: "ModerServer Root CA"
  secretName: moderserver-ca-key-pair
  duration: 87600h
  renewBefore: 720h
  issuerRef:
    name: moderserver-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: moderserver-ca
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  ca:
    secretName: moderserver-ca-key-pair
