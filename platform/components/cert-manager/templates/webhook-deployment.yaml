apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "common.names.name" . }}-webhook
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "common.names.name" . }}-webhook
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: webhook
        app.kubernetes.io/part-of: moderserver
    spec:
      serviceAccountName: cert-manager-webhook
      securityContext:
        {{- include "common.security.pod" (dict) | nindent 8 }}
      containers:
        - name: cert-manager-webhook
          image: {{ include "common.images.ref" (dict "ctx" . "name" "cert-manager-webhook") | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --secure-port=10250
            - --dynamic-serving-ca-secret-namespace=cert-manager
            - --dynamic-serving-ca-secret-name=cert-manager-webhook-ca
            - --dynamic-serving-dns-names=cert-manager-webhook,cert-manager-webhook.cert-manager,cert-manager-webhook.cert-manager.svc,cert-manager-webhook.cert-manager.svc.cluster.local
          ports:
            - name: https
              containerPort: 10250
            - name: healthcheck
              containerPort: 6080
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthcheck
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            {{- include "common.security.container" (dict) | nindent 12 }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      {{- include "common.scheduling.controlPlane" . | nindent 6 }}
