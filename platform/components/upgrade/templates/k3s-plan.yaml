apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: moderserver-k3s-upgrade
  namespace: system-upgrade
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  concurrency: 1
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  serviceAccountName: system-upgrade
  # Cordon only: on a single-node server a drain has nowhere to move workloads
  # to, and K3s keeps running containers across a binary upgrade.
  cordon: true
  version: {{ .Chart.AppVersion | quote }}
  upgrade:
    image: "rancher/k3s-upgrade"
