apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: moderserver-os-upgrade
  namespace: system-upgrade
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  concurrency: 1
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  serviceAccountName: system-upgrade
  # Cordon only: on a single-node server a drain has nowhere to move workloads to.
  cordon: true
  # renovate: datasource=docker depName=alpine
  version: "3.24.4"
  upgrade:
    image: {{ include "common.images.ref" (dict "ctx" . "name" "upgrade") | quote }}
    envs:
      - name: TARGET_OS_VERSION
        # renovate: datasource=docker depName=alpine
        value: "3.24.4"
