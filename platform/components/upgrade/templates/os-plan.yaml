apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: moderserver-os-upgrade
  namespace: system-upgrade
  labels:
    app.kubernetes.io/part-of: moderserver
spec:
  concurrency: 1
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/master
        operator: In
        values: ["true"]
  serviceAccountName: system-upgrade
  cordon: true
  drain:
    force: true
    skipWaitForDeleteTimeout: 60
  # renovate: datasource=docker depName=alpine
  version: "3.24"
  upgrade:
    image: "ghcr.io/moderserver/os-upgrade:3.24"
    envs:
      - name: TARGET_OS_VERSION
        value: "3.24"
