apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: system-upgrade
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    upgrade.cattle.io/controller: system-upgrade-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      upgrade.cattle.io/controller: system-upgrade-controller
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        upgrade.cattle.io/controller: system-upgrade-controller
    spec:
      serviceAccountName: system-upgrade
      securityContext:
        {{- include "common.security.pod" (dict) | nindent 8 }}
      containers:
        - name: system-upgrade-controller
          image: {{ include "common.images.ref" (dict "ctx" . "name" "system-upgrade-controller") | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "common.security.container" (dict) | nindent 12 }}
          env:
            - name: SYSTEM_UPGRADE_CONTROLLER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['upgrade.cattle.io/controller']
            - name: SYSTEM_UPGRADE_CONTROLLER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SYSTEM_UPGRADE_CONTROLLER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: default-controller-env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: etc-ssl
              mountPath: /etc/ssl
              readOnly: true
            - name: etc-pki
              mountPath: /etc/pki
              readOnly: true
            - name: etc-ca-certificates
              mountPath: /etc/ca-certificates
              readOnly: true
      {{- include "common.scheduling.controlPlane" . | nindent 6 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: etc-ssl
          hostPath:
            path: /etc/ssl
            type: DirectoryOrCreate
        - name: etc-pki
          hostPath:
            path: /etc/pki
            type: DirectoryOrCreate
        - name: etc-ca-certificates
          hostPath:
            path: /etc/ca-certificates
            type: DirectoryOrCreate
