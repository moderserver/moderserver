{{- range $key, $config := .Values.components }}
{{- if $config.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $config.name | default $key }}
  namespace: argocd
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $config.name | default $key }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $config.syncWave | default "0" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.gitops.repoURL | quote }}
    targetRevision: {{ $.Values.gitops.targetRevision | quote }}
    path: {{ $config.path }}
    helm:
      releaseName: {{ $config.name | default $key }}
      valuesObject:
        global:
          {{- toYaml $.Values.global | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $config.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # A sync can fail transiently while a dependency is still starting
    # (admission webhooks, freshly registered CRDs): retry instead of giving up.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion
        - .status
    {{- with $config.ignoreDifferences }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
