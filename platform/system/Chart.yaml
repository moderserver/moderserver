apiVersion: v2
name: system
description: ModerServer Base Platform System Meta-Chart
type: application
version: 0.1.0
appVersion: "1.0.0"
icon: https://raw.githubusercontent.com/kubernetes/kubernetes/master/logo/logo.png
dependencies:
  - name: gateway-api
    version: 0.1.0
    repository: "file://../components/gateway-api"
    condition: gatewayAPI.enabled
  - name: system-upgrade-controller
    version: 0.1.0
    repository: "file://../components/system-upgrade-controller"
    condition: systemUpgradeController.enabled
  - name: upgrade
    version: 0.1.0
    repository: "file://../components/upgrade"
    condition: upgrade.enabled
