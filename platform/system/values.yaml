# ModerServer GitOps Platform Root Application (App of Apps)
#
# These values are set per node by the root Application, which the host
# bootstrap generates from /etc/moderserver/moderserver.conf at first boot.
global:
  # Base domain of the server; every component host is <name>.<domain>
  domain: "home.arpa"

gitops:
  # Git repository and revision every platform component is reconciled from.
  # `stable` only ever points at commits that passed the full CI pipeline
  # (static conformance, QEMU E2E and runtime conformance).
  repoURL: "https://github.com/moderserver/moderserver.git"
  targetRevision: "stable"

components:
  gateway-api:
    enabled: true
    name: gateway-api
    path: platform/components/gateway-api
    namespace: moderserver-system
    syncWave: "0"

  cert-manager:
    enabled: true
    name: cert-manager
    path: platform/components/cert-manager
    namespace: cert-manager
    syncWave: "1"

  cluster-issuers:
    enabled: true
    name: cluster-issuers
    path: platform/components/cluster-issuers
    namespace: cert-manager
    syncWave: "2"

  nginx-gateway-fabric:
    enabled: true
    name: nginx-gateway-fabric
    path: platform/components/nginx-gateway-fabric
    namespace: nginx-gateway
    syncWave: "3"

  system-upgrade-controller:
    enabled: true
    name: system-upgrade-controller
    path: platform/components/system-upgrade-controller
    namespace: system-upgrade
    syncWave: "3"

  # Opt-in: once enabled, the node upgrades its K3s binary and Alpine packages
  # to the versions pinned in Git, and reboots itself after a kernel upgrade.
  upgrade:
    enabled: false
    name: upgrade
    path: platform/components/upgrade
    namespace: system-upgrade
    syncWave: "5"

  argocd:
    enabled: true
    name: argocd
    path: platform/components/argocd
    namespace: argocd
    syncWave: "4"
    # argocd-server generates server.secretkey and the admin password into this
    # Secret at first start; Git only declares that the Secret exists.
    ignoreDifferences:
      - group: ""
        kind: Secret
        name: argocd-secret
        namespace: argocd
        jsonPointers:
          - /data
